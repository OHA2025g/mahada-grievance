xt-anchor="start">Illustrative case records. No live case changes.</text><g data-go="C08" role="button" tabindex="0" aria-label="Track a grievance"><rect x="1031" y="923" width="165" height="40" rx="6" fill="white" stroke="#66717E"/><text x="1113.5" y="948.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="#313B48" text-anchor="middle">Track a grievance</text></g><g data-go="C03" role="button" tabindex="0" aria-label="Register a grievance"><rect x="1210" y="923" width="190" height="40" rx="6" fill="#313B48" stroke="#66717E"/><text x="1305.0" y="948.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">Register a grievance</text></g><rect x="264" y="224" width="1136" height="205" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="296" y="280.0" font-family="Helvetica" font-size="28" font-weight="600" fill="#263140" text-anchor="start">Describe the problem. Track the action.</text><text x="296" y="322.0" font-family="Helvetica" font-size="15" font-weight="400" fill="#647281" text-anchor="start">A clear case reference, an accountable office, and an understandable decision.</text><g data-go="C03" role="button" tabindex="0" aria-label="Register a grievance"><rect x="296" y="353" width="221" height="40" rx="6" fill="#313B48" stroke="#66717E"/><text x="406.5" y="378.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">Register a grievance</text></g><g data-go="C08" role="button" tabindex="0" aria-label="Track an existing case"><rect x="535" y="353" width="220" height="40" rx="6" fill="white" stroke="#66717E"/><text x="645.0" y="378.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="#313B48" text-anchor="middle">Track an existing case</text></g><rect x="264" y="452" width="556" height="146" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="284" y="480.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Housing and allotment</text><text x="284" y="514.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Lottery, eligibility, deposit and possession matters.</text><rect x="844" y="452" width="556" height="146" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="864" y="480.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Property and repairs</text><text x="864" y="514.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Estate records, maintenance and common amenities.</text><rect x="264" y="618" width="556" height="146" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="284" y="646.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Redevelopment</text><text x="284" y="680.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Transit rent, rehabilitation and developer responses.</text><rect x="844" y="618" width="556" height="146" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="864" y="646.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Track an existing case</text><text x="864" y="680.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Use your source token or internal MHADA reference.</text></svg>