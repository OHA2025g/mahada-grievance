nt-family="Helvetica" font-size="12" font-weight="600" fill="#263140" text-anchor="middle" data-go="S06" role="button" tabindex="0">U</text><text x="264" y="103.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#73808D" text-anchor="start">System administration  /  T02</text><text x="264" y="144.0" font-family="Helvetica" font-size="26" font-weight="600" fill="#263140" text-anchor="start">Officers, substitutes and delegation</text><text x="264" y="175.0" font-family="Helvetica" font-size="13.2" font-weight="400" fill="#667381" text-anchor="start">Maintain current designation holders and delegated powers.</text><rect x="236" y="916" width="1204" height="54" rx="0" fill="white" stroke="#D9DEE4" opacity="1"/><text x="264" y="946.0" font-family="Helvetica" font-size="11" font-weight="400" fill="#73808D" text-anchor="start">Illustrative case records. No live case changes.</text><g data-go="V03" role="button" tabindex="0" aria-label="Unaccepted assignments"><rect x="974.421875" y="923" width="201.21875" height="40" rx="6" fill="white" stroke="#66717E"/><text x="1075.03125" y="948.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="#313B48" text-anchor="middle">Unaccepted assignments</text></g><g data-go="V02" role="button" tabindex="0" aria-label="Save effective assignment"><rect x="1189.640625" y="923" width="210.359375" height="40" rx="6" fill="#313B48" stroke="#66717E"/><text x="1294.8203125" y="948.0" font-family="Helvetica" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">Save effective assignment</text></g><rect x="264" y="224" width="748" height="442" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="284" y="252.0" font-family="Helvetica" font-size="14.5" font-weight="600" fill="#263140" text-anchor="start">Details and required information</text><text x="284.0" y="281.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Designation *</text><g data-edit="Designation" role="button" tabindex="0" aria-label="Edit Designation"><rect x="284.0" y="291" width="346.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Designation"><text x="295.0" y="313.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Relevant case-owning designation</text></g></g><text x="646.0" y="281.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Current officer *</text><g data-edit="Current officer" role="button" tabindex="0" aria-label="Edit Current officer"><rect x="646.0" y="291" width="346.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Current officer"><text x="657.0" y="313.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Officer A - sample</text></g></g><text x="284.0" y="348.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Effective from *</text><g data-edit="Effective from" role="button" tabindex="0" aria-label="Edit Effective from"><rect x="284.0" y="358" width="346.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Effective from"><text x="295.0" y="380.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#8A95A1" text-anchor="start">Enter effective from</text></g></g><text x="646.0" y="348.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Effective until</text><g data-edit="Effective until" role="button" tabindex="0" aria-label="Edit Effective until"><rect x="646.0" y="358" width="346.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Effective until"><text x="657.0" y="380.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#8A95A1" text-anchor="start">Enter effective until</text></g></g><text x="284" y="415.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Substitute</text><g data-edit="Substitute" role="button" tabindex="0" aria-label="Edit Substitute"><rect x="284" y="425" width="708" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Substitute"><text x="295" y="447.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Officer B - sample</text></g></g><text x="284" y="482.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Delegated authority *</text><g data-edit="Delegated authority" role="button" tabindex="0" aria-label="Edit Delegated authority"><rect x="284" y="492" width="708" height="63" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Delegated authority"><text x="295" y="514.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Reference approved delegation</text></g></g><text x="284" y="582.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Transfer handling *</text><g data-edit="Transfer handling" role="button" tabindex="0" aria-label="Edit Transfer handling"><rect x="284" y="592" width="708" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Transfer handling"><text x="295" y="614.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Reassign active tasks with history</text></g><text x="976" y="614.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#718092" text-anchor="start">v</text></g><rect x="1036" y="224" width="364" height="115" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="1056" y="252.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">No lost ownership</text><text x="1056" y="286.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anch