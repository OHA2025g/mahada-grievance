le entry</text><rect x="294" y="289" width="620" height="208" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="314" y="317.0" font-family="Helvetica" font-size="14.5" font-weight="600" fill="#263140" text-anchor="start">Select and verify access</text><text x="314.0" y="346.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Account type *</text><g data-edit="Account type" role="button" tabindex="0" aria-label="Edit Account type"><rect x="314.0" y="356" width="282.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Account type"><text x="325.0" y="378.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#566474" text-anchor="start">Citizen</text></g><text x="580.0" y="378.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#718092" text-anchor="start">v</text></g><text x="612.0" y="346.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Mobile / email *</text><g data-edit="Mobile / email" role="button" tabindex="0" aria-label="Edit Mobile / email"><rect x="612.0" y="356" width="282.0" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Mobile / email"><text x="623.0" y="378.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#8A95A1" text-anchor="start">Enter mobile / email</text></g></g><text x="314" y="413.0" font-family="Helvetica" font-size="11.5" font-weight="600" fill="#263140" text-anchor="start">Verification code *</text><g data-edit="Verification code" role="button" tabindex="0" aria-label="Edit Verification code"><rect x="314" y="423" width="580" height="37" rx="5" fill="#FCFDFE" stroke="#CAD2DB" opacity="1"/><g data-field-value="Verification code"><text x="325" y="445.0" font-family="Helvetica" font-size="12" font-weight="400" fill="#8A95A1" text-anchor="start">Enter verification code</text></g></g><rect x="947" y="292" width="419" height="115" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="967" y="320.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Code delivery</text><text x="967" y="354.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Resend after the configured interval. Show the delivery result.</text><rect x="947" y="423" width="419" height="115" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="967" y="451.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Contact verification</text><text x="967" y="485.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Control of a contact channel does not prove the complaint.</text><rect x="947" y="554" width="419" height="115" rx="8" fill="white" stroke="#CBD2D9" opacity="1"/><text x="967" y="582.0" font-family="Helvetica" font-size="14" font-weight="600" fill="#263140" text-anchor="start">Department access</text><text x="967" y="616.0" font-family="Helvetica" font-size="12.8" font-weight="400" fill="#637080" text-anchor="start">Use the approved staff identity provider.</text></svg>